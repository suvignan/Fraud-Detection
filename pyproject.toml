# Makes src/fraud installable with: pip install -e .
# Dependencies stay in requirements.txt for now.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud"
version = "0.1.0"
description = "Credit-card fraud detection pipeline"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]   # E/F = errors and bugs (unused imports, undefined names...), I = sorted imports
